<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1200, initial-scale=1.0" />
<title>BandBox 头图 1200x800</title>
<style>
  /* 得意黑 Smiley Sans v2.0.1 · SIL OFL 1.1 · github.com/atelier-anchor/smiley-sans
     只有 Oblique 一个字重，天生倾斜、窄长；正文层级靠字号和颜色，不靠字重 */
  @font-face {
    font-family: "Smiley Sans";
    src: url("assets/fonts/SmileySans-Oblique.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }

  @page {
    size: 1200px 800px;
    margin: 0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 1200px;
    height: 800px;
    overflow: hidden;
    font-family: "Smiley Sans", "MiSans", "Noto Sans CJK SC", "PingFang SC", sans-serif;
    /* 单字重字体：禁掉合成加粗/合成斜体，避免 900 被算法加粗成糊边 */
    font-synthesis: none;
    background: #F4F8FF;
  }

  .canvas {
    position: relative;
    width: 1200px;
    height: 800px;
    background: linear-gradient(135deg, #F8FAFF 0%, #EEF4FF 55%, #E3EEFF 100%);
    overflow: hidden;
  }

  .bg-arc {
    position: absolute;
    right: -180px;
    top: -110px;
    width: 780px;
    height: 1020px;
    border-radius: 50%;
    background: linear-gradient(160deg, #D5E5FF 0%, #C2D9FF 55%, #B5D0FF 100%);
    z-index: 1;
  }

  .bg-glow {
    position: absolute;
    right: 120px;
    top: 140px;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(37, 99, 235, 0.18) 0%, rgba(37, 99, 235, 0) 70%);
    z-index: 2;
  }

  .left-panel {
    position: absolute;
    left: 88px;
    top: 118px;
    width: 520px;
    z-index: 10;
  }

  /* 独立大应用图标 */
  .app-icon-wrap {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 24px;
    border: 3px solid #FFFFFF;
    background: #0F62FE;
  }

  .app-icon-wrap img {
    width: 104%;
    height: 104%;
    margin: -2%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
  }

  /* 主标题：BandBox 成为绝对视觉第一层级 */
  .main-title {
    font-size: 130px;
    font-weight: 400;
    color: #0B1736;
    line-height: 1.02;
    letter-spacing: -1px;
    margin-bottom: 30px;
  }

  /* 中文定位副标题（品牌蓝高亮） */
  .cn-title {
    font-size: 52px;
    font-weight: 400;
    color: #2563EB;
    line-height: 1.2;
    letter-spacing: 0.5px;
    margin-bottom: 24px;
  }

  /* 卖点说明 */
  .subtitle {
    font-size: 34px;
    font-weight: 400;
    color: #36527D;
    line-height: 1.4;
    letter-spacing: 1px;
  }

  .dot-grid {
    position: absolute;
    left: 92px;
    bottom: 72px;
    width: 74px;
    z-index: 10;
  }

  .dot-row {
    margin-bottom: 14px;
    font-size: 0;
  }

  .dot-row span {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #9CC0FF;
    margin-right: 14px;
  }

  .dot-row span:last-child {
    margin-right: 0;
  }

  /* 右侧界面墙：多块界面同时展示，中间那块是单栏主页
     212×520 → 160×392 等比缩放；上下出血，读作「还有更多」 */
  .screen-wall {
    position: absolute;
    left: 606px;
    top: 0;
    width: 524px;
    height: 800px;
    z-index: 10;
  }

  /* 每块都带一圈窄机身：金属渐变 + 白色高光边，跟屏幕的黑分开 */
  .screen-wall .cell {
    position: absolute;
    width: 160px;
    height: 392px;
    padding: 5px;
    border-radius: 80px;
    background: linear-gradient(150deg, #4A5262 0%, #1A1F29 55%, #0B0E14 100%);
    box-shadow:
      0 0 0 1.5px rgba(255, 255, 255, 0.72),
      0 16px 34px rgba(15, 29, 64, 0.26);
  }

  .screen-wall .cell img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 75px;
  }

  /* 居中那块：白圈更实、外带一层蓝晕，把视线收回来 */
  .screen-wall .cell-hero {
    z-index: 5;
    transform: scale(1.06);
    box-shadow:
      0 0 0 2.5px #FFFFFF,
      0 26px 60px rgba(15, 29, 64, 0.34),
      0 0 90px rgba(44, 91, 255, 0.32);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="bg-arc"></div>
    <div class="bg-glow"></div>

    <div class="left-panel">
      <div class="app-icon-wrap">
        <img src="media/icon_astrobox.png" alt="BandBox Icon" />
      </div>

      <h1 class="main-title">BandBox</h1>

      <div class="cn-title">小米手环百宝箱</div>

      <p class="subtitle">三十八件小工具 · 抬手就能用</p>
    </div>

    <div class="dot-grid">
      <div class="dot-row"><span></span><span></span><span></span></div>
      <div class="dot-row"><span></span><span></span><span></span></div>
      <div class="dot-row"><span></span><span></span><span></span></div>
    </div>

    <div class="screen-wall">
      <!-- 左列 -->
      <div class="cell" style="left: -5px; top: -40px;">
        <img src="media/preview-2.png" alt="BandBox 计算器" />
      </div>
      <div class="cell" style="left: -5px; top: 374px;">
        <img src="media/preview-3.png" alt="BandBox 每日一言" />
      </div>

      <!-- 中列：上下两块出血，正中间是主界面（单栏列表，缩到这么小也读得清） -->
      <div class="cell" style="left: 180px; top: -222px;">
        <img src="media/preview-4.png" alt="BandBox 日历" />
      </div>
      <div class="cell cell-hero" style="left: 180px; top: 204px;">
        <img src="assets/screenshots/page_home_list.png" alt="BandBox 主界面" />
      </div>
      <div class="cell" style="left: 180px; top: 630px;">
        <img src="assets/screenshots/page_storage.png" alt="BandBox 存储空间" />
      </div>

      <!-- 右列 -->
      <div class="cell" style="left: 365px; top: -30px;">
        <img src="assets/screenshots/page_password.png" alt="BandBox 密码生成" />
      </div>
      <div class="cell" style="left: 365px; top: 384px;">
        <img src="assets/screenshots/page_history.png" alt="BandBox 史载今日" />
      </div>
    </div>
  </div>
</body>
</html>
